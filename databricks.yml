bundle:
  name: uiowa-agentic-ai-hackathon

include:
  - resources/*.yml

variables:
  catalog:
    description: Catalog containing patient data
    default: workspace
  schema:
    description: Schema containing patient data
    default: chiro_hackathon

workspace:
  root_path: ~/.bundle/${bundle.name}/${bundle.target}

targets:
  dev:
    default: true
    mode: development