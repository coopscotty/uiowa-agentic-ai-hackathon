resources:
  jobs:
    retention_workflow:
      name: retention-workflow-${bundle.target}

      tasks:
        - task_key: collect_data
          notebook_task:
            notebook_path: ../src/Retention Data Collector.py
            source: WORKSPACE

        - task_key: run_agent
          depends_on:
            - task_key: collect_data
          notebook_task:
            notebook_path: ../src/Retention Agent.py
            source: WORKSPACE
