resources:
  jobs:
    retention_workflow:
      name: retention-workflow-${bundle.target}

      tasks:
        - task_key: collect_data
          notebook_task:
            notebook_path: ${workspace.file_path}/src/Retention Data Collector
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}

        - task_key: run_agent
          depends_on:
            - task_key: collect_data
          notebook_task:
            notebook_path: ${workspace.file_path}/src/Retention Agent
            source: WORKSPACE
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}